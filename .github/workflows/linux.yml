name: Linux

# Build and test on branches, pull requests and manual runs; release calls this workflow.
on:
  push:
    branches: ["**"]
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 cmake ninja-build pkg-config \
            libzstd-dev libbrotli-dev libsqlite3-dev libssl-dev libpcre2-dev libicu-dev
      - name: Build and test the core
        env:
          CXX: g++-12
        run: |
          cmake -S "$RUNNER_TEMP/agent-speed/linux" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAGENTSPEED_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            qtarch: linux_gcc_64
            host: linux
            arch: x86_64
            debarch: amd64
          # Qt's arm64 binaries are built on Ubuntu 24.04 (glibc 2.38+, the GCC 13 runtime), so arm64 packages are too.
          - runner: ubuntu-24.04-arm
            qtarch: linux_gcc_arm64
            host: linux_arm64
            arch: aarch64
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12 cmake ninja-build pkg-config file dpkg-dev \
            libzstd-dev libbrotli-dev libsqlite3-dev libssl-dev libpcre2-dev libicu-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb1-dev libxcb-shape0-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libfontconfig1 libdbus-1-3 libfuse2
      - name: Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.qtarch }}
          modules: qtwebsockets
          cache: true
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-fork\.[0-9]+)?$ ]]; then
            test "$(cat "$RUNNER_TEMP/agent-speed/VERSION")" = "${GITHUB_REF_NAME#v}"
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(sed -nE 's/^project\(AgentSpeedLinux VERSION ([0-9.]+).*/\1/p' "$RUNNER_TEMP/agent-speed/linux/CMakeLists.txt")-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the app
        env:
          CXX: g++-12
        run: |
          cmake -S "$RUNNER_TEMP/agent-speed/linux" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAGENTSPEED_BUILD_TESTS=OFF -DAGENTSPEED_BUILD_APP=ON \
            -DAGENTSPEED_VERSION="${{ steps.version.outputs.value }}" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Package
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: '"$RUNNER_TEMP/agent-speed/linux/packaging/package.sh" build dist "${{ steps.version.outputs.value }}"'
      - uses: actions/upload-artifact@v4
        with:
          name: agent-speed-linux-${{ matrix.host }}
          path: |
            dist/AgentSpeed-Linux-${{ matrix.arch }}.AppImage
            dist/agent-speed_${{ steps.version.outputs.value }}_${{ matrix.debarch }}.deb
            dist/SHA256SUMS-Linux-${{ matrix.arch }}.txt
          if-no-files-found: error
