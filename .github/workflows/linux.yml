name: Linux

# The release workflow calls this for tagged builds.
on:
  workflow_call:
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed"
      - name: Dependencies
        run: |
          python3 downstream/release_network.py -- sudo apt-get update
          python3 downstream/release_network.py -- sudo apt-get install -y --no-install-recommends g++-12 cmake ninja-build pkg-config \
            libzstd-dev libbrotli-dev libsqlite3-dev libssl-dev libpcre2-dev libicu-dev libcurl4-openssl-dev
      - name: Build and test the core
        env:
          CXX: g++-12
        run: |
          python3 -c 'import sys; from downstream.release_network import run; run(sys.argv[1:], capture=False, timeout=300)' cmake -S "$RUNNER_TEMP/agent-speed/linux" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAGENTSPEED_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            qtarch: linux_gcc_64
            host: linux
            arch: x86_64
            debarch: amd64
          # Qt's arm64 binaries are built on Ubuntu 24.04 (glibc 2.38+, the GCC 13 runtime), so arm64 packages are too.
          - runner: ubuntu-24.04-arm
            qtarch: linux_gcc_arm64
            host: linux_arm64
            arch: aarch64
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed"
      - name: Dependencies
        run: |
          python3 downstream/release_network.py -- sudo apt-get update
          python3 downstream/release_network.py -- sudo apt-get install -y --no-install-recommends g++-12 cmake ninja-build pkg-config file dpkg-dev \
            libzstd-dev libbrotli-dev libsqlite3-dev libssl-dev libpcre2-dev libicu-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb1-dev libxcb-shape0-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xinput0 libfontconfig1 libdbus-1-3 libfuse2
      - name: Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.qtarch }}
          modules: qtwebsockets
          cache: true
      - name: Version
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-fork\.[0-9]+)?$ ]]
          echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build the app
        env:
          CXX: g++-12
        run: |
          cmake -S "$RUNNER_TEMP/agent-speed/linux" -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAGENTSPEED_BUILD_TESTS=OFF -DAGENTSPEED_BUILD_APP=ON \
            -DAGENTSPEED_VERSION="${{ steps.version.outputs.value }}" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build
      - name: Package
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: '"$RUNNER_TEMP/agent-speed/linux/packaging/package.sh" build dist "${{ steps.version.outputs.value }}"'
      - name: Verify packaged versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="$GITHUB_WORKSPACE/dist/AgentSpeed-Linux-${{ matrix.arch }}.AppImage"
          deb="$GITHUB_WORKSPACE/dist/agent-speed_${version}_${{ matrix.debarch }}.deb"
          test "$(dpkg-deb -f "$deb" Version)" = "$version"
          mkdir -p "$RUNNER_TEMP/image" "$RUNNER_TEMP/deb"
          (cd "$RUNNER_TEMP/image" && "$image" --appimage-extract >/dev/null)
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          for executable in "$RUNNER_TEMP/image/squashfs-root/usr/bin/agent-speed" "$RUNNER_TEMP/deb/opt/agent-speed/bin/agent-speed"; do
            strings "$executable" | grep -Fx -- "$version" || strings -el "$executable" | grep -Fx -- "$version"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agent-speed-linux-${{ matrix.host }}
          path: |
            dist/AgentSpeed-Linux-${{ matrix.arch }}.AppImage
            dist/agent-speed_${{ steps.version.outputs.value }}_${{ matrix.debarch }}.deb
            dist/SHA256SUMS-Linux-${{ matrix.arch }}.txt
          if-no-files-found: error
