name: macOS check

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to test
        required: true
  push:
    branches: [downstream/patch-build]
    paths:
      - 'macos/**'
      - 'spec/**'
      - 'downstream/patches/**'
      - 'downstream/manage.py'
      - 'downstream/release_network.py'
      - '.github/workflows/macos-check.yml'

permissions:
  contents: read

concurrency:
  group: macos-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed-macos-check-$GITHUB_RUN_ID"
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          test -n "$xcode"
          developer="$xcode/Contents/Developer"
          test -x "$developer/usr/bin/xcodebuild"
          echo "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer" xcodebuild -version | tr '\n' ' '
          echo
      - name: Test core
        working-directory: ${{ runner.temp }}/agent-speed-macos-check-${{ github.run_id }}/macos
        run: |
          # Keep the runner-load timeout retry local to the focused check rather than
          # discovering it only after a Release tag is created.
          swift test || {
            echo "::warning::swift test failed; retrying once"
            swift test
          }
