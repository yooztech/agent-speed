name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spec:
    name: Release contracts
    if: github.repository == 'yooztech/agent-speed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify trusted release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-fork\.[0-9]+)?$ ]]
          python3 downstream/release_network.py -- git fetch origin refs/heads/downstream/patch-build
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD
      - name: Test collector zip verifier
        run: python3 downstream/test-verify-collector-zip.py
      - name: Test downstream clone retries
        run: python3 downstream/test-manage.py
      - name: Test release publisher retries
        run: python3 downstream/test-publish-release.py
      - name: Test Windows installer version verifier
        run: python3 downstream/test-release.py WindowsInstallerVersionTests
      - name: Test standalone collector asset contract
        run: python3 downstream/test-release.py CollectorAssetContractTests
      - name: Test collector metadata packaging
        run: python3 downstream/test-package-collector.py
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed-prepared"
      - name: Install zstd and brotli
        run: (command -v zstd && command -v brotli) || (python3 downstream/release_network.py -- sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && python3 downstream/release_network.py -- sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y zstd brotli)
      - name: Check version and contracts
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: |
          test -s VERSION
          python3 spec/tools/reference.py --check-fixtures
          python3 spec/tools/report_reference.py
          python3 spec/tools/execution_modes_reference.py
          python3 spec/tools/test_reporting_extensions.py
          python3 spec/tools/vehicles.py
          shellcheck install.sh

  linux:
    name: Linux desktop packages
    needs: spec
    uses: ./.github/workflows/linux.yml
    permissions:
      contents: read

  collector:
    name: Linux x86_64 collector
    needs: spec
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed-prepared"
      - name: Install dependencies
        run: python3 downstream/release_network.py -- sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update && python3 downstream/release_network.py -- sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake g++ pkg-config libzstd-dev libbrotli-dev libsqlite3-dev libicu-dev libssl-dev libcurl4-openssl-dev libgtest-dev
      - name: Build and test Linux
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: |
          test "$(uname -m)" = x86_64
          cmake -S linux -B build-remote -DCMAKE_BUILD_TYPE=Release -DAGENTSPEED_BUILD_APP=OFF -DFETCHCONTENT_SOURCE_DIR_GOOGLETEST=/usr/src/googletest
          cmake --build build-remote -j2
          ctest --test-dir build-remote --output-on-failure
      - name: Package collector
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: |
          install -Dm755 build-remote/collector/agentspeed-collector dist/collectors/linux-x86_64/agent-speed-collector
          tar -C dist/collectors -cf "$RUNNER_TEMP/collectors.tar" linux-x86_64
          python3 "$GITHUB_WORKSPACE/downstream/package-collector.py" dist/collectors/linux-x86_64/agent-speed-collector "$RUNNER_TEMP/collector-release" --tag "$GITHUB_REF_NAME" --maintenance-commit "$GITHUB_SHA" --build-environment ubuntu-22.04 --verify-shared-identity
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-collector
          path: ${{ runner.temp }}/collectors.tar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: standalone-linux-x86_64-collector
          path: ${{ runner.temp }}/collector-release/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: collector
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Prepare downstream tree
        run: python3 downstream/manage.py prepare "$RUNNER_TEMP/agent-speed-prepared"
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-collector
          path: ${{ runner.temp }}/collector-artifact
      - name: Unpack collector
        run: |
          mkdir -p "$RUNNER_TEMP/collectors"
          tar -xf "$RUNNER_TEMP/collector-artifact/collectors.tar" -C "$RUNNER_TEMP/collectors"
          test -x "$RUNNER_TEMP/collectors/linux-x86_64/agent-speed-collector"
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: Test core
        working-directory: ${{ runner.temp }}/agent-speed-prepared/macos
        run: |
          # A loaded macOS runner can stall the URL loading system past the stub tests' 15 s request timeout
          # (URLError -1001 in HTTPFetcherTests/ReportInviteTests). One full-suite retry separates that runner
          # flake from a real failure; a second failure still blocks the release.
          swift test || {
            echo "::warning::swift test failed; retrying once"
            swift test
          }
      - name: Test update relaunch
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: python3 macos/scripts/test-update-relaunch.py
      - name: Build and verify app bundle
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: |
          macos/scripts/build-app.sh --version "${GITHUB_REF_NAME#v}" --collectors "$RUNNER_TEMP/collectors"
          python3 "$GITHUB_WORKSPACE/downstream/verify-collector-zip.py" dist/AgentSpeed-macOS.zip "$RUNNER_TEMP/collectors/linux-x86_64/agent-speed-collector"
      - name: Verify macOS archive version
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: |
          mkdir -p "$RUNNER_TEMP/mac-version"
          ditto -x -k dist/AgentSpeed-macOS.zip "$RUNNER_TEMP/mac-version"
          plist="$RUNNER_TEMP/mac-version/Agent Speed.app/Contents/Info.plist"
          version="${GITHUB_REF_NAME#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :AgentSpeedVersion' "$plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${version%%-*}"
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-macOS
          path: ${{ runner.temp }}/agent-speed-prepared/dist/AgentSpeed-macOS.zip
          if-no-files-found: error

  windows:
    name: Windows
    needs: [spec, collector]
    runs-on: windows-latest
    env:
      NUGET_ENHANCED_MAX_NETWORK_TRY_COUNT: '6'
      NUGET_ENHANCED_NETWORK_RETRY_DELAY_MILLISECONDS: '1000'
      NUGET_MAX_RETRY_AFTER_DELAY_SECONDS: '10'
    steps:
      - uses: actions/checkout@v5
      - name: Prepare downstream tree
        shell: pwsh
        run: python downstream/manage.py prepare "$env:RUNNER_TEMP/agent-speed-prepared"
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-collector
          path: ${{ runner.temp }}/collector-artifact
      - name: Unpack collector
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/agent-speed-prepared/dist/collectors" | Out-Null
          tar -xf "$env:RUNNER_TEMP/collector-artifact/collectors.tar" -C "$env:RUNNER_TEMP/agent-speed-prepared/dist/collectors"
          if ($LASTEXITCODE -ne 0) { throw 'Collector extraction failed' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore Windows test dependencies
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        shell: pwsh
        run: |
          foreach ($project in @('AgentSpeed.Core.Tests', 'AgentSpeed.Presentation.Tests', 'AgentSpeed.Windows.Tests', 'AgentSpeed.TrafficHelper.Tests')) {
            python "$env:GITHUB_WORKSPACE/downstream/release_network.py" -- dotnet restore "windows/tests/$project"
            if ($LASTEXITCODE -ne 0) { throw "Restore failed for $project" }
          }
      - name: Test core
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: dotnet test windows/tests/AgentSpeed.Core.Tests -c Release --no-restore
      - name: Test presentation
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: dotnet test windows/tests/AgentSpeed.Presentation.Tests -c Release --no-restore -- xUnit.ParallelizeTestCollections=false
      - name: Test Windows consumers
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: dotnet test windows/tests/AgentSpeed.Windows.Tests -c Release --no-restore
      - name: Test traffic helper
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        run: dotnet test windows/tests/AgentSpeed.TrafficHelper.Tests -c Release --no-restore
      - name: Install Inno Setup
        run: python downstream/release_network.py -- choco install innosetup --no-progress -y
      - name: Publish
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        shell: pwsh
        run: ./windows/scripts/publish.ps1 -Installer -Version $env:GITHUB_REF_NAME.Substring(1)
      - name: Verify Windows bundle contents
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expected = (Get-FileHash dist/collectors/linux-x86_64/agent-speed-collector).Hash
          foreach ($arch in @('x64', 'arm64')) {
            $zip = [IO.Compression.ZipFile]::OpenRead("dist/AgentSpeed-Windows-$arch.zip")
            try {
              foreach ($required in @('AgentSpeed.exe', 'collectors/linux-x86_64/agent-speed-collector')) {
                if (-not ($zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq $required -and $_.Length -gt 0 })) { throw "Missing $required in $arch bundle" }
              }
              $entry = $zip.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq 'collectors/linux-x86_64/agent-speed-collector' }
              $stream = $entry.Open(); $sha = [Security.Cryptography.SHA256]::Create()
              try { $actual = [BitConverter]::ToString($sha.ComputeHash($stream)).Replace('-', '') }
              finally { $sha.Dispose(); $stream.Dispose() }
              if ($actual -ne $expected) { throw "Collector mismatch in $arch bundle" }
            } finally { $zip.Dispose() }
          }
      - name: Verify Windows artifact versions
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($arch in @('x64', 'arm64')) {
            $dir = Join-Path $env:RUNNER_TEMP "version-$arch"
            Expand-Archive "dist/AgentSpeed-Windows-$arch.zip" -DestinationPath $dir
            $actual = ((Get-Item (Join-Path $dir 'AgentSpeed.exe')).VersionInfo.ProductVersion -split '\+')[0]
            if ($actual -ne $version) { throw "Windows $arch executable version $actual != $version" }
            $actual = (Get-Item "dist/AgentSpeed-Windows-$arch-Setup.exe").VersionInfo.ProductVersion
            python "$env:GITHUB_WORKSPACE/downstream/verify-windows-installer-version.py" $version $actual
            if ($LASTEXITCODE -ne 0) { throw "Windows $arch installer version verification failed" }
          }
      - name: Smoke test Windows installer
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        shell: pwsh
        run: ./windows/scripts/test-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: AgentSpeed-Windows
          path: |
            ${{ runner.temp }}/agent-speed-prepared/dist/AgentSpeed-Windows-*.zip
            ${{ runner.temp }}/agent-speed-prepared/dist/AgentSpeed-Windows-*-Setup.exe
          if-no-files-found: error

  windows-arm-installer:
    name: Windows ARM64 installer
    needs: [collector, windows]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - name: Prepare downstream tree
        run: python downstream/manage.py prepare "$env:RUNNER_TEMP/agent-speed-prepared"
      - uses: actions/download-artifact@v8
        with:
          name: AgentSpeed-Windows
          path: ${{ runner.temp }}/agent-speed-prepared/dist
      - uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-collector
          path: ${{ runner.temp }}/collector-artifact
      - name: Smoke test ARM64 installer
        working-directory: ${{ runner.temp }}/agent-speed-prepared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/collectors | Out-Null
          tar -xf "$env:RUNNER_TEMP/collector-artifact/collectors.tar" -C dist/collectors
          if ($LASTEXITCODE -ne 0) { throw 'Collector extraction failed' }
          ./windows/scripts/test-installer.ps1 -Architecture arm64

  publish:
    name: Publish release
    needs: [spec, linux, macos, windows, windows-arm-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: AgentSpeed-macOS
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: AgentSpeed-Windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: agent-speed-linux-linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: agent-speed-linux-linux_arm64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: standalone-linux-x86_64-collector
          path: dist
      - name: Verify standalone collector and desktop bundles
        run: |
          LC_ALL=C readelf -h dist/agent-speed-collector-linux-x86_64 | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64$'
          python3 -c 'import hashlib,json,os,pathlib; p=pathlib.Path("dist/agent-speed-collector-linux-x86_64"); m=json.loads(p.with_suffix(".json").read_text()); c=json.loads(pathlib.Path("downstream/config.json").read_text()); h=hashlib.sha256(p.read_bytes()).hexdigest(); assert m["format_version"] == 1 and m["release_tag"] == os.environ["GITHUB_REF_NAME"] and m["maintenance_commit"] == os.environ["GITHUB_SHA"] and m["upstream_commit"] == c["upstream_commit"] and m["os"] == "linux" and m["architecture"] == "x86_64" and m["protocol"]["version"] == 1 and m["sha256"] == h and m["protocol"]["shared_collector"] == {"control_version": 2, "capabilities": ["live_activity_v2", "live_activity_edges_v1", "live_activity_continuity_v1", "shared_collector_v1", "widget_statistics_v2"], "identity": {"command": "--identity", "prefix": "shared-collector-v2", "sha256": h}}'
          (cd dist && sha256sum -c agent-speed-collector-linux-x86_64.sha256)
          python3 downstream/verify-collector-zip.py dist/AgentSpeed-macOS.zip dist/agent-speed-collector-linux-x86_64
          python3 downstream/verify-collector-zip.py --windows dist/AgentSpeed-Windows-x64.zip dist/agent-speed-collector-linux-x86_64
          python3 downstream/verify-collector-zip.py --windows dist/AgentSpeed-Windows-arm64.zip dist/agent-speed-collector-linux-x86_64
      - name: Checksums
        working-directory: dist
        run: sha256sum AgentSpeed-* agent-speed_*.deb SHA256SUMS-Linux-*.txt agent-speed-collector-linux-x86_64* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 downstream/publish-release.py
